appId: com.xboxaudiobridge.desktop
productName: Desk Audio Bridge
copyright: Copyright © 2019 UnknownSKL and Desk Audio Bridge contributors

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - '!app/images{,/**/*}'
      - '!app/achievements{,/**/*}'
      - '!app/profile{,/**/*}'
      - '!app/settings{,/**/*}'
      - '!app/stream{,/**/*}'
      - '!app/xcloud{,/**/*}'

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: ../../LICENSE
    to: LICENSE-GREENLIGHT.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/legal
    to: legal

beforePack: ./scripts/prepare-release.cjs
afterPack: ./scripts/verify-packaged-licenses.cjs

win:
  icon: resources/icon.ico
  # Resource editing is handled by our Windows-only afterPack hook. This avoids
  # the legacy signing-tool archive's unrelated privileged macOS symlinks.
  signAndEditExecutable: false
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
